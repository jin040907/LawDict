name: Preview Website

on:
  workflow_dispatch:  # 수동 실행
  pull_request:
    branches: [ main, master ]

jobs:
  preview:
    runs-on: ubuntu-latest
    
    # PostgreSQL 서비스 (DB_URL이 없을 때 사용)
    # 실제 DB_URL이 설정되어 있으면 그걸 사용하고, 없으면 이 로컬 PostgreSQL 사용
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bill_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start server
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DB_URL: ${{ secrets.DB_URL || 'postgresql://test_user:test_password@localhost:5432/bill_db' }}
      run: |
        cd service
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
        echo "DB_URL=${{ secrets.DB_URL || 'postgresql://test_user:test_password@localhost:5432/bill_db' }}" >> .env
        
        echo "=========================================="
        echo "🔍 데이터베이스 연결 정보 확인"
        echo "=========================================="
        if [ -n "$DB_URL" ] && [ "$DB_URL" != "postgresql://test_user:test_password@localhost:5432/bill_db" ]; then
          echo "✅ 실제 데이터베이스 사용"
          DB_HOST=$(echo "$DB_URL" | sed -n 's/.*@\([^:]*\):.*/\1/p')
          echo "   호스트: $DB_HOST"
        else
          echo "⚠️  실제 DB_URL이 설정되지 않음"
          echo "   테스트용 로컬 PostgreSQL 사용"
        fi
        echo "=========================================="
        
        # 데이터베이스 연결 테스트
        echo ""
        echo "데이터베이스 연결 테스트 중..."
        python3 << 'EOF'
        import os
        from sqlalchemy import create_engine, text
        
        db_url = os.getenv("DB_URL", "postgresql://test_user:test_password@localhost:5432/bill_db")
        print(f"연결 시도: {db_url.split('@')[0]}@***")
        
        try:
            engine = create_engine(db_url)
            with engine.connect() as conn:
                # 테이블 존재 확인
                result = conn.execute(text("""
                    SELECT EXISTS (
                        SELECT FROM information_schema.tables 
                        WHERE table_schema = 'public' 
                        AND table_name = 'final_training_data_copy_sample10_md'
                    );
                """))
                table_exists = result.scalar()
                
                if table_exists:
                    # 데이터 개수 확인
                    count_result = conn.execute(text("SELECT COUNT(*) FROM public.final_training_data_copy_sample10_md"))
                    count = count_result.scalar()
                    print(f"✅ 테이블 존재: final_training_data_copy_sample10_md")
                    print(f"✅ 데이터 개수: {count}")
                else:
                    print("⚠️  테이블이 존재하지 않습니다: final_training_data_copy_sample10_md")
        except Exception as e:
            print(f"❌ 데이터베이스 연결 실패: {e}")
        EOF
        
        echo ""
        echo "서버 시작 중..."
        # 서버 시작 (백그라운드)
        nohup python -m uvicorn main:app --host 0.0.0.0 --port 8888 > server.log 2>&1 &
        echo $! > server.pid
        sleep 10
        echo "✅ Server started"
    
    - name: Setup and start ngrok tunnel
      if: github.event_name == 'workflow_dispatch'
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        echo "=========================================="
        echo "🔧 ngrok 설정 단계 시작"
        echo "=========================================="
        
        if [ -z "$NGROK_AUTH_TOKEN" ]; then
          echo ""
          echo "⚠️  NGROK_AUTH_TOKEN이 설정되지 않았습니다."
          echo ""
          echo "외부 접근을 위해서는 ngrok 토큰이 필요합니다."
          echo ""
          echo "설정 방법:"
          echo "1. https://ngrok.com 에서 가입"
          echo "2. Dashboard > Your Authtoken 복사"
          echo "3. GitHub > Settings > Secrets > Actions"
          echo "4. NGROK_AUTH_TOKEN 추가"
          echo ""
          echo "현재 서버는 내부에서만 접근 가능합니다:"
          echo "http://localhost:8888"
          echo ""
          echo "=========================================="
          echo "이 단계를 완료하려면 NGROK_AUTH_TOKEN을 설정하세요."
          echo "=========================================="
          exit 0
        fi
        
        echo "✅ NGROK_AUTH_TOKEN이 설정되어 있습니다."
        echo ""
        
        echo "Downloading ngrok..."
        wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        tar xzf ngrok-v3-stable-linux-amd64.tgz
        chmod +x ngrok
        sudo mv ngrok /usr/local/bin/
        
        echo "Configuring ngrok with auth token..."
        ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
        
        echo "Starting ngrok tunnel..."
        ngrok http 8888 --log=stdout > ngrok.log 2>&1 &
        NGROK_PID=$!
        echo "ngrok PID: $NGROK_PID"
        sleep 8
        
        # ngrok API에서 URL 가져오기
        for i in {1..10}; do
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null | grep -o '"public_url":"https://[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$NGROK_URL" ]; then
            break
          fi
          echo "Waiting for ngrok... ($i/10)"
          sleep 2
        done
        
        if [ -n "$NGROK_URL" ]; then
          echo ""
          echo "=========================================="
          echo "🌐🌐🌐 PUBLIC WEBSITE URL 🌐🌐🌐"
          echo "=========================================="
          echo ""
          echo "  $NGROK_URL"
          echo ""
          echo "=========================================="
          echo "위 URL을 복사하여 브라우저에서 접속하세요!"
          echo "=========================================="
          echo ""
          echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV
          echo "::notice title=🌐 Website URL::Access your website at: $NGROK_URL"
          echo "::warning title=Website URL::Public URL: $NGROK_URL"
        else
          echo ""
          echo "=========================================="
          echo "⚠️  ngrok URL을 가져오지 못했습니다"
          echo "=========================================="
          echo "ngrok.log 내용:"
          cat ngrok.log || echo "No ngrok.log found"
          echo ""
          echo "ngrok API 응답:"
          curl -s http://localhost:4040/api/tunnels || echo "ngrok API 접근 실패"
        fi
    
    - name: Test website endpoints
      run: |
        echo "=== Testing Website Endpoints ==="
        
        # 메인 페이지 확인
        echo "1. Testing main page (GET /)..."
        curl -v http://localhost:8888/ 2>&1 | head -20
        
        # 검색 API 확인
        echo -e "\n2. Testing search API (GET /api/search)..."
        curl -v "http://localhost:8888/api/search?q=test" 2>&1 | head -20
        
        # 서버 로그 확인
        echo -e "\n3. Server logs:"
        tail -20 service/server.log || echo "No server log found"
        
        # ngrok URL 표시 (수동 실행 시)
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          if [ -n "$NGROK_URL" ]; then
            echo ""
            echo "=========================================="
            echo "🌐 PUBLIC WEBSITE URL: $NGROK_URL"
            echo "=========================================="
            echo "브라우저에서 위 URL로 접속하세요!"
          else
            echo ""
            echo "⚠️  ngrok URL을 찾을 수 없습니다."
            echo "NGROK_AUTH_TOKEN이 설정되어 있는지 확인하세요."
          fi
        fi
    
    - name: Upload server logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: server-logs
        path: service/server.log
        retention-days: 1
    
    - name: Keep server running (manual mode)
      if: github.event_name == 'workflow_dispatch'
      env:
        NGROK_URL: ${{ env.NGROK_URL }}
      run: |
        echo ""
        echo "=========================================="
        echo "🚀 서버 실행 중..."
        echo "=========================================="
        if [ -n "$NGROK_URL" ]; then
          echo ""
          echo "🌐🌐🌐 PUBLIC WEBSITE URL 🌐🌐🌐"
          echo "  $NGROK_URL"
          echo ""
          echo "위 URL로 접속하세요!"
          echo ""
        else
          echo ""
          echo "⚠️  외부 접근 URL이 없습니다."
          echo "NGROK_AUTH_TOKEN이 설정되어 있는지 확인하세요."
          echo ""
          echo "내부 접근: http://localhost:8888"
          echo ""
        fi
        echo "=========================================="
        echo "서버는 최대 1시간 동안 실행됩니다."
        echo "워크플로우를 취소하면 즉시 종료됩니다."
        echo "=========================================="
        echo ""
        echo "ngrok URL을 확인하려면 위의 'Setup and start ngrok tunnel' 단계를 확인하세요."
        echo ""
        sleep 3600
    
    - name: Stop server
      if: always()
      run: |
        pkill -f ngrok || true
        if [ -f service/server.pid ]; then
          kill $(cat service/server.pid) || true
          echo "Server stopped"
        fi
