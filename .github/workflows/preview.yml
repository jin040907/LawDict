name: Preview Website

on:
  workflow_dispatch:  # 수동 실행
  pull_request:
    branches: [ main, master ]

jobs:
  preview:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bill_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start server
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DB_URL: postgresql://test_user:test_password@localhost:5432/bill_db
      run: |
        cd service
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
        # 서버 시작 (백그라운드)
        nohup python -m uvicorn main:app --host 0.0.0.0 --port 8888 > server.log 2>&1 &
        echo $! > server.pid
        sleep 10
        echo "Server started"
    
    - name: Test website endpoints
      run: |
        echo "=== Testing Website Endpoints ==="
        
        # 메인 페이지 확인
        echo "1. Testing main page (GET /)..."
        curl -v http://localhost:8888/ 2>&1 | head -20
        
        # 검색 API 확인
        echo -e "\n2. Testing search API (GET /api/search)..."
        curl -v "http://localhost:8888/api/search?q=test" 2>&1 | head -20
        
        # 서버 로그 확인
        echo -e "\n3. Server logs:"
        tail -20 service/server.log || echo "No server log found"
    
    - name: Upload server logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: server-logs
        path: service/server.log
        retention-days: 1
    
    - name: Stop server
      if: always()
      run: |
        if [ -f service/server.pid ]; then
          kill $(cat service/server.pid) || true
          echo "Server stopped"
        fi
