name: Preview Website

on:
  workflow_dispatch:  # 수동 실행
  pull_request:
    branches: [ main, master ]

jobs:
  preview:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bill_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start server
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DB_URL: postgresql://test_user:test_password@localhost:5432/bill_db
      run: |
        cd service
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
        # 서버 시작 (백그라운드)
        nohup python -m uvicorn main:app --host 0.0.0.0 --port 8888 > server.log 2>&1 &
        echo $! > server.pid
        sleep 10
        echo "Server started"
    
    - name: Setup ngrok
      uses: ngrok/setup-ngrok@v3
      with:
        ngrok-version: '3'
        ngrok-auth-token: ${{ secrets.NGROK_AUTH_TOKEN }}
      if: github.event_name == 'workflow_dispatch'
    
    - name: Create ngrok tunnel
      if: github.event_name == 'workflow_dispatch' && secrets.NGROK_AUTH_TOKEN != ''
      run: |
        echo "Starting ngrok tunnel..."
        ngrok http 8888 --log=stdout > ngrok.log 2>&1 &
        NGROK_PID=$!
        echo "ngrok PID: $NGROK_PID"
        sleep 8
        
        # ngrok API에서 URL 가져오기
        for i in {1..10}; do
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null | grep -o '"public_url":"https://[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$NGROK_URL" ]; then
            break
          fi
          echo "Waiting for ngrok... ($i/10)"
          sleep 2
        done
        
        if [ -n "$NGROK_URL" ]; then
          echo "=========================================="
          echo "🌐 PUBLIC WEBSITE URL: $NGROK_URL"
          echo "=========================================="
          echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV
          echo "::notice title=🌐 Website URL::Access your website at: $NGROK_URL"
          echo "::warning title=Website URL::Public URL: $NGROK_URL"
        else
          echo "Failed to get ngrok URL. Check ngrok.log:"
          cat ngrok.log || echo "No ngrok.log found"
        fi
    
    - name: Show local URL (if ngrok not available)
      if: github.event_name == 'workflow_dispatch' && (secrets.NGROK_AUTH_TOKEN == '' || env.NGROK_URL == '')
      run: |
        echo "=========================================="
        echo "⚠️  NGROK_AUTH_TOKEN이 설정되지 않았습니다."
        echo "=========================================="
        echo "외부 접근을 위해서는 ngrok 토큰이 필요합니다."
        echo ""
        echo "설정 방법:"
        echo "1. https://ngrok.com 에서 가입"
        echo "2. Dashboard > Your Authtoken 복사"
        echo "3. GitHub > Settings > Secrets > Actions"
        echo "4. NGROK_AUTH_TOKEN 추가"
        echo ""
        echo "현재 서버는 내부에서만 접근 가능합니다:"
        echo "http://localhost:8888"
        echo "=========================================="
    
    - name: Test website endpoints
      run: |
        echo "=== Testing Website Endpoints ==="
        
        # 메인 페이지 확인
        echo "1. Testing main page (GET /)..."
        curl -v http://localhost:8888/ 2>&1 | head -20
        
        # 검색 API 확인
        echo -e "\n2. Testing search API (GET /api/search)..."
        curl -v "http://localhost:8888/api/search?q=test" 2>&1 | head -20
        
        # 서버 로그 확인
        echo -e "\n3. Server logs:"
        tail -20 service/server.log || echo "No server log found"
        
        # ngrok URL 표시 (수동 실행 시)
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          if [ -n "$NGROK_URL" ]; then
            echo ""
            echo "=========================================="
            echo "🌐 PUBLIC WEBSITE URL: $NGROK_URL"
            echo "=========================================="
            echo "브라우저에서 위 URL로 접속하세요!"
          else
            echo ""
            echo "⚠️  ngrok URL을 찾을 수 없습니다."
            echo "NGROK_AUTH_TOKEN이 설정되어 있는지 확인하세요."
          fi
        fi
    
    - name: Upload server logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: server-logs
        path: service/server.log
        retention-days: 1
    
    - name: Keep server running (manual mode)
      if: github.event_name == 'workflow_dispatch'
      env:
        NGROK_URL: ${{ env.NGROK_URL }}
      run: |
        echo "=========================================="
        if [ -n "$NGROK_URL" ]; then
          echo "🌐 서버가 실행 중입니다!"
          echo "Public URL: $NGROK_URL"
          echo "=========================================="
        else
          echo "⚠️  서버가 실행 중이지만 외부 접근이 불가능합니다."
          echo "NGROK_AUTH_TOKEN을 설정하면 외부 URL을 받을 수 있습니다."
          echo "=========================================="
        fi
        echo "서버는 1시간 동안 실행되거나 워크플로우를 취소할 때까지 계속됩니다."
        echo "URL은 위의 'Create ngrok tunnel' 단계에서 확인할 수 있습니다."
        sleep 3600
    
    - name: Stop server
      if: always()
      run: |
        pkill -f ngrok || true
        if [ -f service/server.pid ]; then
          kill $(cat service/server.pid) || true
          echo "Server stopped"
        fi
